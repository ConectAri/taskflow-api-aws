# Profile ativado em producao via SPRING_PROFILES_ACTIVE=prod (Elastic Beanstalk).
# Datasource (URL, usuario, senha) chega via variaveis de ambiente
# SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD,
# que o Spring Boot mapeia automaticamente para spring.datasource.* — nao precisam
# ser repetidas aqui.

# Sem esta propriedade, o Hibernate usa "none" como padrao para bancos nao embarcados
# (MySQL/RDS), ou seja, nenhuma tabela e criada mesmo com as entidades JPA mapeadas.
# "update" faz o Hibernate criar/alterar o schema automaticamente a partir das entidades.
#
# Trade-off consciente: "update" e adequado apenas para este projeto de demonstracao
# (prazo curto, sem historico de dados a proteger). Em um ambiente de producao real,
# o ideal seria usar uma ferramenta de migracao versionada como Flyway ou Liquibase,
# aplicando alteracoes de schema atraves de scripts revisados e auditaveis, em vez de
# deixar o Hibernate inferir e aplicar mudancas automaticamente no banco — o que pode
# causar perda de dados ou alteracoes inesperadas em um schema de producao real.
spring.jpa.hibernate.ddl-auto=update
